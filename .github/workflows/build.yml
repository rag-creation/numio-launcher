name: Build APK

# Test builds only. Real releases are built and signed on RR's own computer,
# so the Numio signing key never goes to GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Keep the same throwaway test key between builds, so a new test build
      # installs over the last one (and your dock stays).
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: launcher-test-key

      # staging = release settings (R8 on), signed with the test key, app id ...launcher.test
      # assembleRelease too, so a problem in the real release build shows up here first.
      - name: Build test APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleStaging assembleRelease 2>&1 | tee build.log

      # On failure, turn the first error lines into annotations so they show on the run page.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|^ +> |error:|Could not" build.log | grep -v "> Task" | head -30 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      # On failure: the lines that say why (crashes, failed tests), shown on the run page
      - name: Explain failure
        if: failure()
        run: |
          grep -E "FAILED|Exception|Error:|Caused by|crashed|Process .* finished with non-zero|> Task .* FAILED" build.log \
            | grep -v "^\s*at " | head -15 | while IFS= read -r line; do
            echo "::warning::${line//%/%25}"
          done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            grep -A2 "<failure" "$f" | head -6 | tr '\n' ' ' | cut -c1-600 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::warning::$(basename "$f"): ${line//%/%25}"
            done
          done

      # One line with every test class (tests run / failed), shown on the run page
      - name: Test summary
        if: always()
        run: |
          total=0; failed=0; parts=""
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            name=$(grep -o 'testsuite name="[^"]*"' "$f" | head -1 | sed 's/.*name="//;s/"//')
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc 0-9)
            fl=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | tr -dc 0-9)
            total=$((total + t)); failed=$((failed + fl))
            parts="$parts ${name##*.} $t/$fl,"
          done
          echo "::notice::Tests: $total run, $failed failed. Per class (run/failed):${parts%,}"

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/staging/app-staging.apk LauncherTest.apk
          echo "APK_NAME=LauncherTest.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: LauncherTest.apk
          path: LauncherTest.apk

      # The APK also goes on a draft release named "Test build" (Releases page, only you see it).
      # A draft has no git tag, so F-Droid's update check never sees it.
      - name: Publish test build (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build -y --cleanup-tag || true
          for id in $(gh api repos/$GITHUB_REPOSITORY/releases --jq '.[] | select(.draft and .name == "Test build") | .id'); do
            gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/$id
          done
          gh release create "test-${GITHUB_SHA::7}" "$APK_NAME" --draft \
            --target "$GITHUB_SHA" --title "Test build" \
            --notes "Latest build from main (${GITHUB_SHA::7}). For testing only. Installs as Launcher Test, next to the real app."
